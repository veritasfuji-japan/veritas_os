name: Audit Evidence Profile v0.2 Operation Binding (offline)
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  operation-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline validation dependencies
        run: python -m pip install 'pytest>=8,<9' 'jsonschema>=4.20,<5' 'PyYAML>=6,<7'
      - name: Validate v0.1 synthetic fixture (backward compatibility)
        run: python scripts/validation/validate_audit_evidence_profile.py tests/validation/fixtures/synthetic_example.json
      - name: Validate v0.2 synthetic fixture
        run: python scripts/validation/validate_audit_evidence_profile.py tests/validation/fixtures/synthetic_v0_2_example.json
      - name: Reject v0.1 negative cases
        run: python tests/validation/test_audit_evidence_profile_negative_cases.py
      - name: Validate v0.2 schema, binding and cross-version negatives
        run: python -m pytest -q tests/validation/test_audit_evidence_profile_v0_2.py
      - name: Validate v0.1 and v0.2 chain-bridge positive and negative cases
        run: python -m pytest -q tests/validation/test_audit_evidence_chain_bridge.py
