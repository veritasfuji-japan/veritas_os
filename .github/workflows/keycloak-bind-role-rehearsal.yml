name: Keycloak Bind Role Rehearsal

on:
  pull_request:
    paths:
      - '.github/workflows/keycloak-bind-role-rehearsal.yml'
      - 'veritas_os/tests/test_keycloak_bind_role_rehearsal.py'
      - 'veritas_os/tests/test_saas_role_grant_bind_rehearsal.py'
      - 'veritas_os/policy/sandbox_*.py'
      - 'veritas_os/policy/bind_effect_reconciliation.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keycloak-bind-role-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERITAS_KEYCLOAK_REHEARSAL: "1"
      KC_BOOTSTRAP_ADMIN_USERNAME: fixture-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --retries 5 --timeout 60 -r veritas_os/requirements.txt pytest pytest-asyncio httpx cryptography
      - name: Start disposable Keycloak on loopback
        run: |
          set -euo pipefail
          KC_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KC_BOOTSTRAP_ADMIN_PASSWORD"
          echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$KC_BOOTSTRAP_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          export KC_BOOTSTRAP_ADMIN_PASSWORD
          docker run -d --name keycloak-bind-proof -p 127.0.0.1:18080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME -e KC_BOOTSTRAP_ADMIN_PASSWORD \
            quay.io/keycloak/keycloak:26.8.2 start-dev
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:18080/realms/master/.well-known/openid-configuration > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify scoped grant and read-only reconciliation
        run: python -m pytest -q veritas_os/tests/test_keycloak_bind_role_rehearsal.py --tb=short
      - name: Remove disposable Keycloak
        if: always()
        run: docker rm -f keycloak-bind-proof || true
