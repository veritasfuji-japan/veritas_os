name: Keycloak Bind Role Rehearsal

on:
  pull_request:
    paths:
      - '.github/workflows/keycloak-bind-role-rehearsal.yml'
      - 'veritas_os/tests/test_keycloak_bind_role_rehearsal.py'
      - 'veritas_os/tests/test_saas_role_grant_bind_rehearsal.py'
      - 'veritas_os/policy/sandbox_*.py'
      - 'veritas_os/policy/bind_effect_reconciliation.py'
      - 'veritas_os/policy/keycloak_*.py'
      - 'veritas_os/policy/native_bind_authorization_consumption.py'
      - 'veritas_os/policy/bind_coverage_registry.py'
      - 'scripts/validation/export_keycloak_rehearsal_evidence.py'
      - 'alembic/versions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keycloak-bind-role-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: veritas_test
          POSTGRES_DB: veritas_test
        options: >-
          --health-cmd "pg_isready -U veritas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      VERITAS_KEYCLOAK_REHEARSAL: "1"
      VERITAS_DATABASE_URL: postgresql+psycopg://veritas:veritas_test@localhost:5432/veritas_test
      KC_BOOTSTRAP_ADMIN_USERNAME: fixture-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --retries 5 --timeout 60 -r veritas_os/requirements.txt pytest pytest-asyncio httpx cryptography
      - name: Use PostgreSQL 16 clients for the recovery test
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euxo pipefail
          # Use the same image as the service and mount only recovery scratch files.
          client_image=$(docker inspect --format '{{.Image}}' "$POSTGRES_SERVICE_ID")
          echo "SANDBOX_PG_CLIENT_IMAGE=$client_image" >> "$GITHUB_ENV"
          export SANDBOX_PG_CLIENT_IMAGE="$client_image"
          client_bin="$RUNNER_TEMP/sandbox-pg-client-bin"
          mkdir -p "$client_bin" "$RUNNER_TEMP/sandbox-pg-restore"
          cat > "$client_bin/run-client" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          scratch="$RUNNER_TEMP/sandbox-pg-restore"
          exec docker run --rm -i --network host \
            --user "$(id -u):$(id -g)" --volume "$scratch:$scratch" \
            --env PGHOST --env PGPORT --env PGUSER --env PGPASSWORD --env PGDATABASE --env PGSSLMODE \
            --entrypoint "${0##*/}" "$SANDBOX_PG_CLIENT_IMAGE" "$@"
          BASH
          chmod +x "$client_bin/run-client"
          for tool in pg_dump pg_restore psql; do
            ln -s run-client "$client_bin/$tool"
            "$client_bin/$tool" --version
          done
          echo "$client_bin" >> "$GITHUB_PATH"

      - name: Apply reservation schema
        run: alembic upgrade head
      - name: Start disposable Keycloak on loopback
        run: |
          set -euo pipefail
          KC_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KC_BOOTSTRAP_ADMIN_PASSWORD"
          echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$KC_BOOTSTRAP_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          export KC_BOOTSTRAP_ADMIN_PASSWORD
          docker run -d --name keycloak-bind-proof -p 127.0.0.1:18080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME -e KC_BOOTSTRAP_ADMIN_PASSWORD \
            quay.io/keycloak/keycloak:26.8.2 start-dev
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:18080/realms/master/.well-known/openid-configuration > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify scoped grant and read-only reconciliation
        env:
          VERITAS_KEYCLOAK_EVIDENCE_DIR: ${{ runner.temp }}/keycloak-rehearsal-cases
          VERITAS_SANDBOX_RESTORE_E2E: "1"
          TMPDIR: ${{ runner.temp }}/sandbox-pg-restore
        run: |
          set -euo pipefail
          python -m pytest -q veritas_os/tests/test_keycloak_bind_role_rehearsal.py --tb=short \
            --junitxml="$RUNNER_TEMP/keycloak-rehearsal.xml"
          python - "$RUNNER_TEMP/keycloak-rehearsal.xml" <<'PYTHON'
          import sys
          from xml.etree import ElementTree

          report = ElementTree.parse(sys.argv[1])
          for scenario in ("restore_after_grant", "restore_then_resume"):
              name = f"test_keycloak_lab_executor_https_boundary[{scenario}-True]"
              cases = [case for case in report.iter("testcase") if case.get("name") == name]
              if len(cases) != 1 or any(
                  cases[0].find(tag) is not None for tag in ("failure", "error", "skipped")
              ):
                  raise SystemExit(f"The Keycloak {scenario} case must run once and pass.")
          PYTHON
      - name: Upload Keycloak rehearsal test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-rehearsal-junit-${{ github.sha }}
          path: ${{ runner.temp }}/keycloak-rehearsal.xml
          if-no-files-found: warn
      - name: Assemble crash rehearsal evidence
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          KEYCLOAK_EVIDENCE_DIR: ${{ runner.temp }}/keycloak-rehearsal-cases
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          test "$tested_sha" = "$GITHUB_SHA"
          keycloak_image="$(docker inspect --format '{{.Config.Image}}' keycloak-bind-proof)"
          keycloak_image_id="$(docker inspect --format '{{.Image}}' keycloak-bind-proof)"
          postgres_image_id="$(docker inspect --format '{{.Image}}' "$POSTGRES_CONTAINER")"
          keycloak_repo_digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$keycloak_image_id" |
            awk '/^quay\.io\/keycloak\/keycloak@sha256:/ && !found {print; found=1}')"
          postgres_repo_digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$postgres_image_id" |
            awk '/^((docker\.io\/)?library\/)?postgres@sha256:/ && !found {
              sub(/^[^@]+/, "docker.io/library/postgres"); print; found=1
            }')"
          postgres_version="$(docker exec "$POSTGRES_CONTAINER" psql -XAt -U veritas -d veritas_test -c 'SHOW server_version')"
          python scripts/validation/export_keycloak_rehearsal_evidence.py \
            --scenario-dir "$KEYCLOAK_EVIDENCE_DIR" \
            --output "$RUNNER_TEMP/keycloak-rehearsal-evidence.json" \
            --tested-sha "$tested_sha" \
            --keycloak-image "$keycloak_image" \
            --keycloak-image-id "$keycloak_image_id" \
            --keycloak-repo-digest "$keycloak_repo_digest" \
            --postgres-repo-digest "$postgres_repo_digest" \
            --postgres-version "$postgres_version"
      - name: Upload crash rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-rehearsal-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/keycloak-rehearsal-evidence.json
          if-no-files-found: error
      - name: Remove disposable Keycloak
        if: always()
        run: docker rm -f keycloak-bind-proof || true
