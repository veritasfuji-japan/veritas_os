name: TASK-017F Bind Coverage Regeneration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CI dependency profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r veritas_os/requirements-ci.txt

      - name: Regenerate bind coverage evidence
        run: |
          python -m scripts.governance.export_bind_coverage_evidence
          git diff -- docs/en/validation/bind-coverage-evidence.latest.json docs/en/validation/bind-coverage-evidence.latest.md || true

      - name: Upload regenerated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: task017f-bind-coverage-regenerated
          path: |
            docs/en/validation/bind-coverage-evidence.latest.json
            docs/en/validation/bind-coverage-evidence.latest.md
          if-no-files-found: error
