name: Audit Cross Host Rehearsal Contract v0.1
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verifier-input-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verifier dependencies
        run: |
          python -m pip install -r veritas_os/requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Validate independent trust inputs and strict TLS failure
        run: |
          python -m pytest -q tests/validation/test_audit_cross_host_rehearsal_v0_1.py -v --tb=short
      - name: Existing custody regression
        run: |
          python -m pytest -q tests/validation/test_audit_custody_head_store_v0_1.py tests/validation/test_audit_remote_custody_https_v0_1.py
