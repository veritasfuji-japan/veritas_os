name: Observable Digest Resolver AER-01 Exact Identity V1

on:
  pull_request:
    paths:
      - "veritas_os/audit/observable_digest_resolver.py"
      - "veritas_os/tests/test_observable_digest_resolver_behavior.py"
      - "veritas_os/tests/test_observable_digest_resolver_activation_evidence_review.py"
      - "security/observable_digest_resolver_minimal_behavior_implementation_v1.json"
      - "security/observable_digest_resolver_activation_evidence_review_v1.json"
      - "scripts/quality/check_observable_digest_resolver_aer01_v1.py"
      - ".github/workflows/observable-digest-resolver-aer01-v1.yml"
  push:
    branches: [main]
    paths:
      - "veritas_os/audit/observable_digest_resolver.py"
      - "veritas_os/tests/test_observable_digest_resolver_behavior.py"
      - "veritas_os/tests/test_observable_digest_resolver_activation_evidence_review.py"
      - "security/observable_digest_resolver_minimal_behavior_implementation_v1.json"
      - "security/observable_digest_resolver_activation_evidence_review_v1.json"
      - "scripts/quality/check_observable_digest_resolver_aer01_v1.py"
      - ".github/workflows/observable-digest-resolver-aer01-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aer01-exact-implementation-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r veritas_os/requirements.txt pytest pytest-asyncio
      - name: Run AER-01 exact identity proof
        run: PYTHONPATH=. python scripts/quality/check_observable_digest_resolver_aer01_v1.py
      - name: Bind artifact to exact tested SHA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/observable-digest-resolver-aer01-v1/proof-report.json").read_text())
          assert report["tested_sha"] == "${{ github.sha }}"
          assert report["result"] == "PASS"
          assert report["proof_status"] in {"PENDING_INDEPENDENT_CLOSURE", "CLOSED_PASS"}
          assert report["focused_tests_passed"] is True
          assert all(report["identity_matches"].values())
          assert all(report["invariants"].values())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observable-digest-resolver-aer01-v1-${{ github.sha }}
          path: artifacts/observable-digest-resolver-aer01-v1/*
          retention-days: 90
