name: VERITAS CAGE Phase 5D Human Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: veritas-cage-phase5d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CAGE_PHASE5D_SHA: "50b12e7d983db0e3d7faf206ac6aa600294f33ac"
  PHASE5C_VERITAS_BASELINE: "c8109424f5fe6d97b39305edc76347da2e97025a"
  SECURITY_CLOSURE_BASELINE: "3ec803df325f0b16b0b3e3d47ba3b60f125f5c6e"
  VERITAS_CAGE_PHASE5_BEARER_TOKEN: "phase5d-ci-local-only-token"
  PHASE5D_REDIS_URL: "redis://127.0.0.1:6379"

jobs:
  human-review-flow:
    name: veritas-cage-phase5d
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout VERITAS proof source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused runtime dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            pytest==9.0.3 \
            PyYAML==6.0.3 \
            fastapi==0.137.2 \
            uvicorn==0.30.3 \
            httpx==0.28.1 \
            redis==6.4.0

      - name: Run focused Phase 5D tests
        run: |
          set -euxo pipefail
          python -m pytest \
            tests/governance/test_cage_provider03_phase5a_runtime.py \
            tests/governance/test_cage_provider03_phase5c_runner.py \
            tests/governance/test_cage_provider03_phase5d_runner.py \
            -q

      - name: Checkout pinned CAGE Phase 5D source
        run: |
          set -euxo pipefail
          rm -rf /tmp/cage-phase5d
          git init /tmp/cage-phase5d
          git -C /tmp/cage-phase5d remote add origin https://github.com/google/cybernetic-agent-governance-engine.git
          git -C /tmp/cage-phase5d fetch --depth 1 origin "${CAGE_PHASE5D_SHA}"
          git -C /tmp/cage-phase5d checkout --detach FETCH_HEAD
          test "$(git -C /tmp/cage-phase5d rev-parse HEAD)" = "${CAGE_PHASE5D_SHA}"

      - name: Verify Redis service
        run: |
          set -euxo pipefail
          python - <<'PY'
          import asyncio
          import redis.asyncio as redis

          async def main():
              client = redis.from_url("redis://127.0.0.1:6379", decode_responses=True)
              try:
                  assert await client.ping() is True
              finally:
                  await client.aclose()

          asyncio.run(main())
          PY

      - name: Start VERITAS loopback runtime
        run: |
          set -euxo pipefail
          python -m uvicorn \
            veritas_os.governance.cage_provider03_phase5a_runtime:create_phase5a_app \
            --factory \
            --host 127.0.0.1 \
            --port 8765 \
            --log-level warning \
            > /tmp/veritas-phase5d.log 2>&1 &
          echo $! > /tmp/veritas-phase5d.pid

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              -H "Authorization: Bearer ${VERITAS_CAGE_PHASE5_BEARER_TOKEN}" \
              http://127.0.0.1:8765/baseline/US_FED \
              > /tmp/phase5d-baseline.json; then
              exit 0
            fi
            sleep 0.5
          done

          cat /tmp/veritas-phase5d.log
          exit 1

      - name: Run real CAGE Phase 5D human review flow
        id: proof
        run: |
          set -euxo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

          python scripts/run_veritas_cage_phase5d_runtime.py \
            --cage-repo /tmp/cage-phase5d \
            --endpoint http://127.0.0.1:8765 \
            --token "${VERITAS_CAGE_PHASE5_BEARER_TOKEN}" \
            --redis-url "${PHASE5D_REDIS_URL}" \
            --veritas-source-sha "${SOURCE_SHA}" \
            --cage-source-sha "${CAGE_PHASE5D_SHA}" \
            --phase5c-veritas-baseline "${PHASE5C_VERITAS_BASELINE}" \
            --security-closure-baseline "${SECURITY_CLOSURE_BASELINE}" \
            --output-dir artifacts/veritas-cage-phase5d

      - name: Stop loopback runtime
        if: always()
        run: |
          if test -f /tmp/veritas-phase5d.pid; then
            kill "$(cat /tmp/veritas-phase5d.pid)" 2>/dev/null || true
          fi
          cat /tmp/veritas-phase5d.log 2>/dev/null || true

      - name: Bind Phase 5D artifacts to source
        env:
          SOURCE_SHA: ${{ steps.proof.outputs.source_sha }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from pathlib import Path

          root = Path("artifacts/veritas-cage-phase5d")
          report_path = root / "phase5d-runtime-report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))

          assert report["veritas_source_sha"] == os.environ["SOURCE_SHA"]
          assert report["cage_source_sha"] == os.environ["CAGE_PHASE5D_SHA"]
          assert report["phase5c_veritas_baseline"] == os.environ["PHASE5C_VERITAS_BASELINE"]
          assert report["security_closure_baseline"] == os.environ["SECURITY_CLOSURE_BASELINE"]
          assert report["real_cage_provider03_client"] is True
          assert report["real_cage_defer_queue"] is True
          assert report["real_redis_queue"] is True
          assert report["real_cage_fria_boundary"] is True
          assert report["loopback_http"] is True
          assert report["mocked_cage_http_client"] is False
          assert report["external_effects_executed"] is False
          assert report["bind_receipt_created_on_escalate"] is False
          assert report["evidence_submitted_on_escalate"] is False
          assert report["cage_human_review_is_veritas_authority"] is False
          assert report["cage_human_review_is_veritas_human_approval"] is False
          assert report["production_claim"] is False
          assert report["google_endorsement_claim"] is False
          assert report["phase5d_status"] == "READY_FOR_PHASE5E"
          assert report["phase5d_blockers"] == []
          assert report["cage_human_review"]["required_quorum"] == 3
          assert report["cage_human_review"]["final_queue_status"] == "RESOLVED"
          assert report["cage_human_review"]["synthetic_operator_records"] is True
          assert report["cage_human_review"]["live_human_identity_claim"] is False
          for key, passed in report["checks"].items():
              if passed is not True:
                  raise SystemExit(f"Phase 5D check failed: {key}")

          artifacts = sorted(root.rglob("*.json"))
          artifact_hashes = {
              str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in artifacts
          }
          run_manifest = {
              "format_version": "veritas-cage-phase5d-run/v1",
              "proof_id": report["proof_id"],
              "veritas_source_sha": os.environ["SOURCE_SHA"],
              "cage_source_sha": os.environ["CAGE_PHASE5D_SHA"],
              "phase5c_veritas_baseline": os.environ["PHASE5C_VERITAS_BASELINE"],
              "security_closure_baseline": os.environ["SECURITY_CLOSURE_BASELINE"],
              "phase5d_status": report["phase5d_status"],
              "phase5d_blockers": report["phase5d_blockers"],
              "environment": {
                  "implementation": platform.python_implementation().lower(),
                  "python_version": platform.python_version(),
              },
              "artifact_sha256": artifact_hashes,
              "claim_boundary": {
                  "external_business_effect": False,
                  "production_deployment": False,
                  "live_human_identity": False,
                  "google_endorsement": False,
                  "commercial_integration": False,
                  "cage_review_is_veritas_authority": False,
                  "cage_review_is_veritas_human_approval": False,
                  "phase5d_complete": True,
                  "phase5e_ready": True,
              },
              "github": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "event_name": os.environ["GITHUB_EVENT_NAME"],
                  "workflow": os.environ["GITHUB_WORKFLOW"],
              },
          }
          (root / "run-manifest.json").write_text(
              json.dumps(run_manifest, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Phase 5D evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veritas-cage-phase5d-${{ steps.proof.outputs.source_sha }}
          path: artifacts/veritas-cage-phase5d/
          if-no-files-found: error
          retention-days: 90
