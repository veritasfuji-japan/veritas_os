name: Audit Checkpoint Signed Custody v0.1
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  signed-custody-real-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: veritas_test
          POSTGRES_DB: veritas_test
        options: >-
          --health-cmd "pg_isready -U veritas -d veritas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      OPENAI_API_KEY: "DUMMY_FOR_CI"
      VERITAS_API_KEY: "DUMMY_FOR_CI"
      VERITAS_DATABASE_URL: "postgresql+psycopg://veritas:veritas_test@localhost:5432/veritas_test"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline and real PostgreSQL dependencies
        run: |
          python -m pip install -r veritas_os/requirements.txt
          python -m pip install "psycopg[binary]" psycopg-pool alembic pytest pytest-asyncio "jsonschema>=4.20,<5" "PyYAML>=6,<7"
      - name: Migrate PostgreSQL audit archive
        run: alembic upgrade head
      - name: Adversarial signed custody and real PostgreSQL tests
        run: |
          mkdir -p test-reports
          python -m pytest -q \
            tests/validation/test_audit_checkpoint_signed_custody_v0_1.py \
            tests/validation/test_audit_checkpoint_signed_custody_postgresql_v0_1.py \
            -v --tb=short --junitxml=test-reports/audit-signed-custody.xml
      - name: Regression for unsigned pinned checkpoint and durable registry
        run: |
          python -m pytest -q \
            tests/validation/test_audit_registry_checkpoint_v0_1.py \
            tests/validation/test_audit_registry_checkpoint_postgresql_v0_1.py \
            tests/validation/test_audit_replay_registry_postgresql_v0_1.py \
            tests/validation/test_audit_replay_observation_v0_1.py \
            tests/validation/test_cross_packet_replay_provenance.py
      - name: Single-host separated-identity custody rehearsal (NOT remote independence)
        run: |
          set -euo pipefail
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin veritas-audit-custodian
          sudo install -d -m 0700 -o veritas-audit-custodian -g veritas-audit-custodian /tmp/veritas-audit-custody-v01
          python -m scripts.validation.audit_registry_checkpoint_cli_v0_1 capture \
            --output /tmp/veritas-audit-capture.json
          sudo install -m 0400 -o veritas-audit-custodian -g veritas-audit-custodian \
            /tmp/veritas-audit-capture.json /tmp/veritas-audit-custody-v01/reference.json
          sudo -u veritas-audit-custodian python - <<'PY' > /tmp/veritas-audit-trusted-pub.txt
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
          from pathlib import Path
          priv = Ed25519PrivateKey.generate()
          target = Path("/tmp/veritas-audit-custody-v01/signing-key.raw")
          target.write_bytes(priv.private_bytes_raw())
          target.chmod(0o600)
          print(priv.public_key().public_bytes(Encoding.Raw, PublicFormat.Raw).hex())
          PY
          sudo -u nobody test ! -r /tmp/veritas-audit-custody-v01/signing-key.raw
          sudo -u veritas-audit-custodian env PYTHONPATH="$GITHUB_WORKSPACE" python \
            -m scripts.validation.audit_checkpoint_signed_custody_cli_v0_1 attest \
            --reference /tmp/veritas-audit-custody-v01/reference.json \
            --private-key /tmp/veritas-audit-custody-v01/signing-key.raw \
            --output /tmp/veritas-audit-custody-v01/receipt.json \
            --sequence 1 --previous-receipt-sha256 "$(printf '%064d' 0)"
          sudo install -m 0644 /tmp/veritas-audit-custody-v01/receipt.json /tmp/veritas-audit-signed-receipt.json
          head="$(python - <<'PY'
          import json
          from veritas_os.security.hash import sha256_of_canonical_json
          with open("/tmp/veritas-audit-signed-receipt.json") as f:
              print(sha256_of_canonical_json(json.load(f)))
          PY
          )"
          pub="$(cat /tmp/veritas-audit-trusted-pub.txt)"
          python -m scripts.validation.audit_checkpoint_signed_custody_cli_v0_1 verify \
            --reference /tmp/veritas-audit-capture.json \
            --receipt /tmp/veritas-audit-signed-receipt.json \
            --trusted-public-key-hex "$pub" --expected-head-sha256 "$head"
          if python -m scripts.validation.audit_checkpoint_signed_custody_cli_v0_1 verify \
            --reference /tmp/veritas-audit-capture.json \
            --receipt /tmp/veritas-audit-signed-receipt.json \
            --trusted-public-key-hex "$pub" --expected-head-sha256 "$(printf '%064x' 1)"; then
            echo "FAIL: wrong external head accepted" >&2
            exit 1
          fi
      - name: Preserve adversarial test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-checkpoint-signed-custody-${{ github.run_id }}
          path: test-reports/audit-signed-custody.xml
          if-no-files-found: warn
