name: Regenerate pnpm lockfile for sharp security fix
on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/regenerate-sharp-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - name: Commit generated lockfile and remove temporary workflow
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/regenerate-sharp-lockfile.yml
          git add pnpm-lock.yaml .github/workflows/regenerate-sharp-lockfile.yml
          git commit -m "security: commit pnpm-generated sharp lockfile"
          git push origin HEAD:security/sharp-0.35.5-cve-2026-96889
