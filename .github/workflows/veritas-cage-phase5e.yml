name: VERITAS CAGE Phase 5E Review Packet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: veritas-cage-phase5e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  review-packet:
    name: veritas-cage-phase5e
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout VERITAS review packet
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 5E manifest tests
        run: |
          set -euxo pipefail
          python -m pip install pytest==9.0.3
          python -m pytest tests/governance/test_cage_phase5e_review_packet.py -q

      - name: Verify Phase 5A-5D GitHub artifact records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          manifest = json.loads(
              Path("artifacts/cage/phase5e-review-manifest.json").read_text(encoding="utf-8")
          )
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          for phase, expected in manifest["phases"].items():
              artifact_id = expected["artifact_id"]
              url = f"https://api.github.com/repos/{repository}/actions/artifacts/{artifact_id}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "veritas-cage-phase5e-proof",
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  actual = json.load(response)

              checks = {
                  "name": actual.get("name") == expected["artifact_name"],
                  "digest": actual.get("digest") == expected["artifact_digest"],
                  "expired": actual.get("expired") is False,
                  "workflow_run_id": actual.get("workflow_run", {}).get("id")
                  == expected["workflow_run_id"],
                  "head_sha": actual.get("workflow_run", {}).get("head_sha")
                  == expected["pr_head_sha"],
              }
              failed = [key for key, passed in checks.items() if not passed]
              if failed:
                  raise SystemExit(f"Phase {phase} artifact mismatch: {failed}; actual={actual}")
              print(f"Phase {phase}: artifact {artifact_id} verified")
          PY

      - name: Build source-bound Phase 5E packet
        id: packet
        run: |
          set -euxo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/veritas-cage-phase5e
          cp artifacts/cage/phase5e-review-manifest.json artifacts/veritas-cage-phase5e/
          cp docs/en/validation/veritas-cage-phase5e-review-packet.md artifacts/veritas-cage-phase5e/

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/veritas-cage-phase5e")
          source_sha = os.popen("git rev-parse HEAD").read().strip()
          manifest = json.loads((root / "phase5e-review-manifest.json").read_text(encoding="utf-8"))
          files = sorted(path for path in root.iterdir() if path.is_file())
          file_hashes = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in files
          }
          run_manifest = {
              "format_version": "veritas-cage-phase5e-run/v1",
              "source_sha": source_sha,
              "phase5e_baseline": manifest["veritas_phase5e_baseline"],
              "cage_latest_reviewed_main": manifest["cage_latest_reviewed_main"],
              "review_status": "READY_FOR_CAGE_SIDE_TECHNICAL_REVIEW",
              "phase_artifact_ids": {
                  phase: record["artifact_id"]
                  for phase, record in manifest["phases"].items()
              },
              "file_sha256": file_hashes,
              "claim_boundary": {
                  "new_execution_capability": False,
                  "external_business_effect": False,
                  "production_readiness": False,
                  "google_endorsement": False,
                  "commercial_integration": False,
                  "technical_review_only": True,
              },
          }
          (root / "run-manifest.json").write_text(
              json.dumps(run_manifest, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Phase 5E technical review packet
        uses: actions/upload-artifact@v4
        with:
          name: veritas-cage-phase5e-${{ steps.packet.outputs.source_sha }}
          path: artifacts/veritas-cage-phase5e/
          if-no-files-found: error
          retention-days: 90
