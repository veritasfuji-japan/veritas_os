name: Observable Digest Resolver AER-02 Runtime Reachability V1

on:
  pull_request:
    paths:
      - "**/*.py"
      - "security/observable_digest_resolver_activation_evidence_review_v1.json"
      - "scripts/quality/check_observable_digest_resolver_aer02_v1.py"
      - ".github/workflows/observable-digest-resolver-aer02-v1.yml"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "security/observable_digest_resolver_activation_evidence_review_v1.json"
      - "scripts/quality/check_observable_digest_resolver_aer02_v1.py"
      - ".github/workflows/observable-digest-resolver-aer02-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aer02-runtime-reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run AER-02 runtime reachability inventory
        run: PYTHONPATH=. python scripts/quality/check_observable_digest_resolver_aer02_v1.py
      - name: Bind artifact to exact tested SHA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/observable-digest-resolver-aer02-v1/proof-report.json").read_text())
          assert report["tested_sha"] == "${{ github.sha }}"
          assert report["result"] == "PASS"
          assert report["proof_status"] == "PENDING_EXACT_MAIN_AND_INDEPENDENT_CLOSURE"
          assert all(report["invariants"].values())
          assert report["production_runtime_paths"] == []
          assert report["undeclared_paths"] == []
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observable-digest-resolver-aer02-v1-${{ github.sha }}
          path: artifacts/observable-digest-resolver-aer02-v1/*
          retention-days: 90
