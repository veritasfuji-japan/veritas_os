name: Audit Remote Custody HTTPS v0.1
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit-remote-custody-tls-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: veritas_test
          POSTGRES_DB: veritas_test
        options: >-
          --health-cmd "pg_isready -U veritas -d veritas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      OPENAI_API_KEY: "DUMMY_FOR_CI"
      VERITAS_API_KEY: "DUMMY_FOR_CI"
      VERITAS_DATABASE_URL: "postgresql+psycopg://veritas:veritas_test@localhost:5432/veritas_test"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline audit and PostgreSQL dependencies
        run: |
          python -m pip install -r veritas_os/requirements.txt
          python -m pip install "psycopg[binary]" psycopg-pool alembic pytest pytest-asyncio "jsonschema>=4.20,<5" "PyYAML>=6,<7"
      - name: Apply existing audit migrations
        run: alembic upgrade head
      - name: Real TLS validation, negative pins, and PostgreSQL rollback detection
        run: |
          mkdir -p test-reports
          python -m pytest -q \
            tests/validation/test_audit_remote_custody_https_v0_1.py \
            tests/validation/test_audit_remote_custody_postgresql_v0_1.py \
            -v --tb=short --junitxml=test-reports/audit-remote-custody-tls.xml
      - name: Preserve existing signed custody and registry regressions
        run: |
          python -m pytest -q \
            tests/validation/test_audit_checkpoint_signed_custody_v0_1.py \
            tests/validation/test_audit_checkpoint_signed_custody_postgresql_v0_1.py \
            tests/validation/test_audit_registry_checkpoint_v0_1.py \
            tests/validation/test_audit_registry_checkpoint_postgresql_v0_1.py \
            tests/validation/test_audit_replay_registry_postgresql_v0_1.py
      - name: Upload transport proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-remote-custody-tls-${{ github.run_id }}
          path: test-reports/audit-remote-custody-tls.xml
          if-no-files-found: warn
