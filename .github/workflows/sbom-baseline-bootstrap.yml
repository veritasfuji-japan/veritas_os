name: SBOM Baseline Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/sbom-baseline-bootstrap.yml'
      - 'security/sbom/baseline/**'

permissions:
  contents: read

jobs:
  bootstrap:
    name: Generate reproducible SBOM baseline twice
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python SBOM tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install cyclonedx-bom==7.3.1

      - name: Generate Python SBOM twice
        run: |
          cyclonedx-py requirements --output-reproducible veritas_os/requirements.txt --output-file security/sbom/python-a.cdx.json
          cyclonedx-py requirements --output-reproducible veritas_os/requirements.txt --output-file security/sbom/python-b.cdx.json
          cmp security/sbom/python-a.cdx.json security/sbom/python-b.cdx.json

      - name: Setup pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Node SBOM twice
        run: |
          pnpm dlx @cyclonedx/cyclonedx-npm@6.0.1 --output-reproducible --output-file security/sbom/node-a.cdx.json --spec-version 1.5
          pnpm dlx @cyclonedx/cyclonedx-npm@6.0.1 --output-reproducible --output-file security/sbom/node-b.cdx.json --spec-version 1.5
          cmp security/sbom/node-a.cdx.json security/sbom/node-b.cdx.json

      - name: Generate source-bound hashes
        run: |
          sha256sum security/sbom/python-a.cdx.json | sed 's#python-a.cdx.json#python.cdx.json#' > security/sbom/python.cdx.sha256
          sha256sum security/sbom/node-a.cdx.json | sed 's#node-a.cdx.json#node.cdx.json#' > security/sbom/node.cdx.sha256
          printf '%s\n' "${GITHUB_SHA}" > security/sbom/source-sha.txt
          cat security/sbom/python.cdx.sha256
          cat security/sbom/node.cdx.sha256

      - name: Upload bootstrap hashes
        uses: actions/upload-artifact@v4
        with:
          name: sbom-baseline-bootstrap
          path: |
            security/sbom/python.cdx.sha256
            security/sbom/node.cdx.sha256
            security/sbom/source-sha.txt
          if-no-files-found: error
