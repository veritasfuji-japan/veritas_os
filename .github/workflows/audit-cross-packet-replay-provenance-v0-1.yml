name: Cross-Packet Replay & Provenance v0.1 (offline)
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  offline-cross-packet-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded offline audit dependencies
        run: python -m pip install 'pytest>=8,<9' 'jsonschema>=4.20,<5' 'PyYAML>=6,<7'
      - name: Run local cross-packet replay and provenance regression suite
        run: python -m pytest -q tests/validation/test_cross_packet_replay_provenance.py
      - name: Preserve Audit Evidence Profile v0.1/v0.2 compatibility
        run: python -m pytest -q tests/validation/test_audit_evidence_profile_v0_2.py tests/validation/test_audit_evidence_chain_bridge.py
      - name: Reject existing negative Audit Evidence Profile cases
        run: python tests/validation/test_audit_evidence_profile_negative_cases.py
