name: VERITAS CAGE Phase 5B Fail-Closed Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: veritas-cage-phase5b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CAGE_PHASE4_SHA: "5f54d5e3403d67101e028ed14fa8dade853fb221"
  CAGE_PHASE5B_SHA: "fcb98bef0b5faea1afcc5a430148fe065b985ef4"
  VERITAS_CAGE_PHASE5_BEARER_TOKEN: "phase5b-ci-local-only-token"

jobs:
  fail-closed-matrix:
    name: veritas-cage-phase5b
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout VERITAS proof source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused runtime dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            pytest==9.0.3 \
            PyYAML==6.0.3 \
            fastapi==0.121.0 \
            uvicorn==0.30.3 \
            httpx==0.28.1

      - name: Run focused Phase 5B tests
        run: |
          set -euxo pipefail
          python -m pytest tests/governance/test_cage_provider03_phase5b_runner.py -q

      - name: Checkout pinned CAGE Phase 5B source
        run: |
          set -euxo pipefail
          rm -rf /tmp/cage-phase5b
          git init /tmp/cage-phase5b
          git -C /tmp/cage-phase5b remote add origin https://github.com/google/cybernetic-agent-governance-engine.git
          git -C /tmp/cage-phase5b fetch --depth 1 origin "${CAGE_PHASE5B_SHA}"
          git -C /tmp/cage-phase5b checkout --detach FETCH_HEAD
          test "$(git -C /tmp/cage-phase5b rev-parse HEAD)" = "${CAGE_PHASE5B_SHA}"

      - name: Start merged VERITAS Phase 5A loopback runtime
        run: |
          set -euxo pipefail
          python -m uvicorn \
            veritas_os.governance.cage_provider03_phase5a_runtime:create_phase5a_app \
            --factory \
            --host 127.0.0.1 \
            --port 8765 \
            --log-level warning \
            > /tmp/veritas-phase5b.log 2>&1 &
          echo $! > /tmp/veritas-phase5b.pid

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              -H "Authorization: Bearer ${VERITAS_CAGE_PHASE5_BEARER_TOKEN}" \
              http://127.0.0.1:8765/baseline/US_FED \
              > /tmp/phase5b-baseline.json; then
              exit 0
            fi
            sleep 0.5
          done

          cat /tmp/veritas-phase5b.log
          exit 1

      - name: Run real CAGE Provider03 Phase 5B matrix
        id: proof
        run: |
          set -euxo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

          python scripts/run_veritas_cage_phase5b_runtime.py \
            --cage-repo /tmp/cage-phase5b \
            --veritas-endpoint http://127.0.0.1:8765 \
            --token "${VERITAS_CAGE_PHASE5_BEARER_TOKEN}" \
            --veritas-source-sha "${SOURCE_SHA}" \
            --cage-source-sha "${CAGE_PHASE5B_SHA}" \
            --cage-phase4-baseline "${CAGE_PHASE4_SHA}" \
            --output-dir artifacts/veritas-cage-phase5b

      - name: Stop loopback runtime
        if: always()
        run: |
          if test -f /tmp/veritas-phase5b.pid; then
            kill "$(cat /tmp/veritas-phase5b.pid)" 2>/dev/null || true
          fi
          cat /tmp/veritas-phase5b.log 2>/dev/null || true

      - name: Bind Phase 5B artifacts to source
        env:
          SOURCE_SHA: ${{ steps.proof.outputs.source_sha }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from pathlib import Path

          root = Path("artifacts/veritas-cage-phase5b")
          report_path = root / "phase5b-runtime-report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))

          if report["real_cage_provider03_client"] is not True:
              raise SystemExit("Phase 5B must use the real CAGE Provider03 client")
          if report["loopback_http"] is not True:
              raise SystemExit("Phase 5B must exercise loopback HTTP")
          if report["mocked_cage_http_client"] is not False:
              raise SystemExit("Phase 5B must not mock the CAGE HTTP client")
          if report["external_effects_executed"] is not False:
              raise SystemExit("Phase 5B must not execute external business effects")
          if report["production_claim"] is not False:
              raise SystemExit("Phase 5B must not claim production deployment")
          if report["google_endorsement_claim"] is not False:
              raise SystemExit("Phase 5B must not claim Google endorsement")
          if report["cage_source_sha"] != os.environ["CAGE_PHASE5B_SHA"]:
              raise SystemExit("Phase 5B CAGE source SHA mismatch")
          if report["cage_phase4_approved_baseline"] != os.environ["CAGE_PHASE4_SHA"]:
              raise SystemExit("Phase 4 baseline mismatch")
          if report["veritas_source_sha"] != os.environ["SOURCE_SHA"]:
              raise SystemExit("Phase 5B VERITAS source SHA mismatch")

          checks = report["fail_closed_matrix"]
          for key, passed in checks.items():
              if passed is not True:
                  raise SystemExit(f"Phase 5B fail-closed check failed: {key}")

          response_checks = report["response_contract_checks"]
          for check_name, passed in response_checks["assertions"].items():
              if passed is not True:
                  raise SystemExit(f"Phase 5B response-contract check failed: {check_name}")

          for case_name in (
              "malformed_json",
              "non_object_json",
              "null_verdict",
              "numeric_verdict",
          ):
              case = response_checks[case_name]
              if case["unsafe_admit"] is not False:
                  raise SystemExit(f"unsafe admit observed for {case_name}")
              if case["fail_closed_result_returned"] is not True:
                  raise SystemExit(f"no fail-closed ValidationResult returned for {case_name}")
              if case["exception_type"] is not None:
                  raise SystemExit(f"exception leaked for {case_name}: {case['exception_type']}")

          audit = report["cage_source_audit"]
          if audit["provider03_validate_catches_json_decode_error"] is not True:
              raise SystemExit("pinned CAGE source must catch JSONDecodeError")
          if audit["provider03_validate_catches_generic_exception"] is not True:
              raise SystemExit("pinned CAGE source must catch unexpected adapter exceptions")

          if report["phase5b_status"] != "READY_FOR_PHASE5C":
              raise SystemExit("Phase 5B must close cleanly before Phase 5C")
          if report["phase5b_blockers"] != []:
              raise SystemExit(f"Phase 5B blockers remain: {report['phase5b_blockers']}")

          artifacts = sorted(root.rglob("*.json"))
          artifact_hashes = {
              str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in artifacts
          }
          run_manifest = {
              "format_version": "veritas-cage-phase5b-run/v2",
              "proof_id": report["proof_id"],
              "veritas_source_sha": os.environ["SOURCE_SHA"],
              "cage_source_sha": os.environ["CAGE_PHASE5B_SHA"],
              "cage_phase4_approved_baseline": os.environ["CAGE_PHASE4_SHA"],
              "phase5b_status": report["phase5b_status"],
              "phase5b_blockers": report["phase5b_blockers"],
              "environment": {
                  "implementation": platform.python_implementation().lower(),
                  "python_version": platform.python_version(),
              },
              "artifact_sha256": artifact_hashes,
              "claim_boundary": {
                  "real_cage_provider03_client": True,
                  "real_loopback_http": True,
                  "external_business_effect": False,
                  "production_deployment": False,
                  "google_endorsement": False,
                  "commercial_integration": False,
                  "phase5b_complete": True,
                  "phase5c_ready": True,
              },
              "github": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "event_name": os.environ["GITHUB_EVENT_NAME"],
                  "workflow": os.environ["GITHUB_WORKFLOW"],
              },
          }
          (root / "run-manifest.json").write_text(
              json.dumps(run_manifest, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Phase 5B evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veritas-cage-phase5b-${{ steps.proof.outputs.source_sha }}
          path: artifacts/veritas-cage-phase5b/
          if-no-files-found: error
          retention-days: 90
